<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GK Travels — Operations CRM</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            surface:      '#F3F4F6',
            card:         '#FFFFFF',
            border:       '#E5E7EB',
            muted:        '#F3F4F6',
            accent:       '#2563EB',
            'accent-dim': '#EFF6FF',
          },
          fontFamily: {
            sans: ['Inter', 'Manrope', 'system-ui', 'sans-serif'],
          },
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <link rel="stylesheet" href="assets/css/app.css" />
</head>
<body class="font-sans antialiased" style="font-family:'Inter',sans-serif; background:#F8F9FA; color:#111827;">

  <!-- Mobile Overlay -->
  <div id="sidebar-overlay" class="fixed inset-0 bg-black/70 z-20 hidden lg:hidden" onclick="toggleSidebar()"></div>

  <!-- App Shell -->
  <div class="flex h-screen overflow-hidden">

    <!-- SIDEBAR -->
    <aside id="sidebar" class="fixed lg:static inset-y-0 left-0 z-30 w-64 flex flex-col bg-surface border-r border-border transform -translate-x-full lg:translate-x-0 transition-transform duration-300">

      <!-- Logo -->
      <div class="flex items-center gap-3 px-6 py-5 border-b border-border">
        <div class="w-8 h-8 rounded-lg bg-white flex items-center justify-center">
          <span class="text-black font-bold text-sm" style="font-family:'Manrope',sans-serif;">GK</span>
        </div>
        <div>
          <div class="text-white font-semibold text-sm tracking-wide" style="font-family:'Manrope',sans-serif;">GK Travels</div>
          <div class="text-gray-500 text-xs">Operations CRM</div>
        </div>
      </div>

      <!-- Nav -->
      <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-0.5">

        <div class="px-3 pt-2 pb-1">
          <span class="text-xs font-medium text-gray-600 uppercase tracking-widest">Main</span>
        </div>

        <a href="#dashboard" class="nav-link group flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-400 hover:text-white hover:bg-muted transition-all duration-150 cursor-pointer" data-module="dashboard">
          <i data-lucide="layout-dashboard" class="w-4 h-4 flex-shrink-0"></i>
          <span class="text-sm font-medium">Dashboard</span>
        </a>

        <a href="#leads" class="nav-link group flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-400 hover:text-white hover:bg-muted transition-all duration-150 cursor-pointer" data-module="leads">
          <i data-lucide="users" class="w-4 h-4 flex-shrink-0"></i>
          <span class="text-sm font-medium">Leads & Sales</span>
        </a>

        <div class="px-3 pt-4 pb-1">
          <span class="text-xs font-medium text-gray-600 uppercase tracking-widest">Operations</span>
        </div>

        <a href="#trips" class="nav-link group flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-400 hover:text-white hover:bg-muted transition-all duration-150 cursor-pointer" data-module="trips">
          <i data-lucide="folder-open" class="w-4 h-4 flex-shrink-0"></i>
          <span class="text-sm font-medium">Trip Files</span>
        </a>

        <a href="#operations" class="nav-link group flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-400 hover:text-white hover:bg-muted transition-all duration-150 cursor-pointer" data-module="operations">
          <i data-lucide="activity" class="w-4 h-4 flex-shrink-0"></i>
          <span class="text-sm font-medium">Operations</span>
        </a>

        <a href="#tasks" class="nav-link group flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-400 hover:text-white hover:bg-muted transition-all duration-150 cursor-pointer" data-module="tasks">
          <i data-lucide="check-square" class="w-4 h-4 flex-shrink-0"></i>
          <span class="text-sm font-medium">Tasks</span>
        </a>

        <a href="#reminders" class="nav-link group flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-400 hover:text-white hover:bg-muted transition-all duration-150 cursor-pointer" data-module="reminders">
          <i data-lucide="bell" class="w-4 h-4 flex-shrink-0"></i>
          <span class="text-sm font-medium">Reminders</span>
        </a>

        <div class="px-3 pt-4 pb-1">
          <span class="text-xs font-medium text-gray-600 uppercase tracking-widest">Finance</span>
        </div>

        <a href="#finance" class="nav-link group flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-400 hover:text-white hover:bg-muted transition-all duration-150 cursor-pointer" data-module="finance">
          <i data-lucide="indian-rupee" class="w-4 h-4 flex-shrink-0"></i>
          <span class="text-sm font-medium">Payments & Finance</span>
        </a>

        <a href="#documents" class="nav-link group flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-400 hover:text-white hover:bg-muted transition-all duration-150 cursor-pointer" data-module="documents">
          <i data-lucide="file-text" class="w-4 h-4 flex-shrink-0"></i>
          <span class="text-sm font-medium">Documents</span>
        </a>

      </nav>

      <!-- User / Footer -->
      <div class="border-t border-border px-4 py-4">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-full bg-muted flex items-center justify-center text-xs font-semibold text-gray-300">GK</div>
          <div class="flex-1 min-w-0">
            <div class="text-sm font-medium text-white truncate">Admin</div>
            <div class="text-xs text-gray-500 truncate">gktravels.ops</div>
          </div>
          <button class="text-gray-600 hover:text-gray-300 transition-colors">
            <i data-lucide="settings" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
    </aside>

    <!-- MAIN AREA -->
    <div class="flex-1 flex flex-col overflow-hidden min-w-0">

      <!-- HEADER -->
      <header class="flex items-center justify-between px-6 py-4 border-b border-border bg-black/50 backdrop-blur-sm flex-shrink-0">
        <div class="flex items-center gap-4">
          <button onclick="toggleSidebar()" class="lg:hidden text-gray-400 hover:text-white transition-colors">
            <i data-lucide="menu" class="w-5 h-5"></i>
          </button>
          <div>
            <h1 id="page-title" class="text-base font-semibold text-white" style="font-family:'Manrope',sans-serif;">Dashboard</h1>
            <p id="page-subtitle" class="text-xs text-gray-500 mt-0.5">Operations Overview</p>
          </div>
        </div>

        <div class="flex items-center gap-3">
          <!-- Search -->
          <div class="hidden sm:flex items-center gap-2 bg-surface border border-border rounded-lg px-3 py-2 w-56 lg:w-72">
            <i data-lucide="search" class="w-3.5 h-3.5 text-gray-500 flex-shrink-0"></i>
            <input type="text" placeholder="Search trips, leads, customers…" class="bg-transparent text-sm text-gray-300 placeholder-gray-600 outline-none w-full" />
          </div>

          <!-- Notifications -->
          <button class="relative p-2 text-gray-400 hover:text-white hover:bg-muted rounded-lg transition-all duration-150" onclick="toggleNotifications()">
            <i data-lucide="bell" class="w-4.5 h-4.5"></i>
          </button>

          <!-- Quick Add -->
          <button onclick="showQuickAdd()" class="flex items-center gap-2 bg-white text-black text-xs font-semibold px-3 py-2 rounded-lg hover:bg-gray-100 transition-all duration-150">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i>
            <span class="hidden sm:inline">New Trip</span>
          </button>
        </div>
      </header>

      <!-- NOTIFICATION PANEL -->
      <div id="notification-panel" class="hidden absolute right-4 top-16 z-50 w-80 bg-card border border-border rounded-xl shadow-2xl overflow-hidden">
        <div class="px-4 py-3 border-b border-border flex items-center justify-between">
          <span class="text-sm font-semibold">Notifications</span>
          <span class="text-xs text-gray-500" id="notif-count">No new alerts</span>
        </div>
        <div class="divide-y divide-border max-h-80 overflow-y-auto" id="notif-list">
          <div class="px-4 py-8 text-center">
            <i data-lucide="bell-off" class="w-6 h-6 text-gray-700 mx-auto mb-2"></i>
            <p class="text-xs text-gray-600">No notifications yet</p>
          </div>
        </div>
        <div class="px-4 py-2.5 border-t border-border">
          <button class="text-xs text-accent hover:text-white transition-colors w-full text-center">View all notifications</button>
        </div>
      </div>

      <!-- MODULE CONTENT -->
      <main id="module-view" class="flex-1 overflow-y-auto bg-black">
        <div class="p-6">
          <div class="flex items-center justify-center h-64 text-gray-600">
            <div class="text-center">
              <i data-lucide="loader-2" class="w-8 h-8 mx-auto mb-3 animate-spin"></i>
              <p class="text-sm">Loading operations center…</p>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- QUICK ADD MODAL -->
  <div id="quick-add-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" onclick="hideQuickAdd()"></div>
    <div class="relative bg-card border border-border rounded-2xl w-full max-w-lg shadow-2xl">
      <div class="flex items-center justify-between px-6 py-4 border-b border-border">
        <h2 class="text-base font-semibold" style="font-family:'Manrope',sans-serif;">Create New Trip File</h2>
        <button onclick="hideQuickAdd()" class="text-gray-500 hover:text-white transition-colors">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      <div class="px-6 py-5 space-y-4">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-medium text-gray-400 mb-1.5">Customer Name *</label>
            <input id="qt-customer" type="text" placeholder="Full name" class="form-input w-full" />
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-400 mb-1.5">Phone</label>
            <input id="qt-phone" type="text" placeholder="+91 XXXXX XXXXX" class="form-input w-full" />
          </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-medium text-gray-400 mb-1.5">Destination *</label>
            <input id="qt-dest" type="text" placeholder="e.g. Dubai, Maldives" class="form-input w-full" />
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-400 mb-1.5">No. of Pax</label>
            <input id="qt-pax" type="number" placeholder="2" min="1" class="form-input w-full" />
          </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-medium text-gray-400 mb-1.5">Departure Date</label>
            <input id="qt-dep" type="date" class="form-input w-full" />
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-400 mb-1.5">Return Date</label>
            <input id="qt-ret" type="date" class="form-input w-full" />
          </div>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-1.5">Trip Type</label>
          <select id="qt-type" class="form-input w-full">
            <option>Honeymoon Package</option>
            <option>Family Vacation</option>
            <option>Corporate Trip</option>
            <option>Group Tour</option>
            <option>Solo Travel</option>
            <option>Luxury Escape</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-1.5">Notes</label>
          <textarea id="qt-notes" placeholder="Special requests, preferences…" rows="2" class="form-input w-full resize-none"></textarea>
        </div>
      </div>
      <div class="flex items-center justify-between px-6 py-4 border-t border-border">
        <button onclick="hideQuickAdd()" class="text-sm text-gray-500 hover:text-white transition-colors">Cancel</button>
        <button onclick="createTrip()" class="bg-white text-black text-sm font-semibold px-5 py-2 rounded-lg hover:bg-gray-100 transition-colors">Create Trip File</button>
      </div>
    </div>
  </div>

  <!-- Global Modal Root -->
  <div id="gk-modal-root"></div>

  <!-- Scripts (module order matters) -->
  <script src="assets/js/data.js"></script>
  <script src="assets/js/modules/dashboard.js"></script>
  <script src="assets/js/modules/leads.js"></script>
  <script src="assets/js/modules/trips.js"></script>
  <script src="assets/js/modules/operations.js"></script>
  <script src="assets/js/modules/tasks.js"></script>
  <script src="assets/js/modules/finance.js"></script>
  <script src="assets/js/modules/documents.js"></script>
  <script src="assets/js/modules/reminders.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
