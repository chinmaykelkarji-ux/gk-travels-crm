<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GK Travels — Operations CRM</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            surface:      '#F3F4F6',
            card:         '#FFFFFF',
            border:       '#E5E7EB',
            muted:        '#F3F4F6',
            accent:       '#2563EB',
            'accent-dim': '#EFF6FF',
          },
          fontFamily: {
            sans: ['Inter', 'Manrope', 'system-ui', 'sans-serif'],
          },
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <link rel="stylesheet" href="assets/css/app.css" />
</head>
<body class="font-sans antialiased" style="font-family:'Inter',sans-serif; background:#F8F9FA; color:#111827;">

  <!-- Mobile Overlay -->
  <div id="sidebar-overlay" class="fixed inset-0 bg-black/70 z-20 hidden lg:hidden" onclick="toggleSidebar()"></div>

  <!-- App Shell -->
  <div class="flex h-screen overflow-hidden">

    <!-- SIDEBAR -->
    <aside id="sidebar" class="fixed lg:static inset-y-0 left-0 z-30 w-64 flex flex-col transform -translate-x-full lg:translate-x-0 transition-transform duration-300" style="background:#0F172A; border-right:1px solid rgba(255,255,255,0.07);">

      <!-- Logo -->
      <div class="flex items-center gap-3 px-5 py-5" style="border-bottom:1px solid rgba(255,255,255,0.07); background:rgba(255,255,255,0.02);">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0" style="background:#2563EB;">
          <span style="color:#fff; font-weight:800; font-size:13px; font-family:'Manrope',sans-serif; letter-spacing:0.5px;">GK</span>
        </div>
        <div>
          <div style="color:#F1F5F9; font-weight:700; font-size:14px; font-family:'Manrope',sans-serif; letter-spacing:0.2px;">GK Travels</div>
          <div style="color:#475569; font-size:11px; margin-top:1px;">Operations CRM</div>
        </div>
      </div>

      <!-- Nav -->
      <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-0.5">

        <a href="#dashboard" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg cursor-pointer" data-module="dashboard">
          <i data-lucide="layout-dashboard" class="w-4 h-4 flex-shrink-0"></i>
          <span class="text-sm font-medium">Dashboard</span>
        </a>

        <a href="#leads" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg cursor-pointer" data-module="leads">
          <i data-lucide="users" class="w-4 h-4 flex-shrink-0"></i>
          <span class="text-sm font-medium">Leads</span>
        </a>

        <a href="#trips" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg cursor-pointer" data-module="trips">
          <i data-lucide="folder-open" class="w-4 h-4 flex-shrink-0"></i>
          <span class="text-sm font-medium">Trips</span>
        </a>

        <a href="#bookings" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg cursor-pointer" data-module="bookings">
          <i data-lucide="ticket" class="w-4 h-4 flex-shrink-0"></i>
          <span class="text-sm font-medium">Bookings</span>
        </a>

        <a href="#customers" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg cursor-pointer" data-module="customers">
          <i data-lucide="contact" class="w-4 h-4 flex-shrink-0"></i>
          <span class="text-sm font-medium">Customers</span>
        </a>

        <a href="#finance" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg cursor-pointer" data-module="finance">
          <i data-lucide="indian-rupee" class="w-4 h-4 flex-shrink-0"></i>
          <span class="text-sm font-medium">Finance</span>
        </a>

        <a href="#operations" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg cursor-pointer" data-module="operations">
          <i data-lucide="activity" class="w-4 h-4 flex-shrink-0"></i>
          <span class="text-sm font-medium">Operations</span>
        </a>

      </nav>

      <!-- User Footer -->
      <div class="px-4 py-4" style="border-top:1px solid rgba(255,255,255,0.07); background:rgba(255,255,255,0.02);">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold flex-shrink-0" style="background:rgba(37,99,235,0.25); color:#60A5FA;">GK</div>
          <div class="flex-1 min-w-0">
            <div class="text-sm font-semibold truncate" style="color:#E2E8F0;">Admin</div>
            <div class="text-xs truncate" style="color:#475569;">gktravels.ops</div>
          </div>
          <button style="color:#475569;" class="hover:text-white transition-colors">
            <i data-lucide="settings" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
    </aside>

    <!-- MAIN AREA -->
    <div class="flex-1 flex flex-col overflow-hidden min-w-0">

      <!-- HEADER -->
      <header class="flex items-center justify-between px-6 py-3.5 flex-shrink-0" style="background:#FFFFFF; border-bottom:1px solid #E2E8F0; box-shadow:0 1px 3px rgba(15,23,42,0.05);">
        <div class="flex items-center gap-4">
          <button onclick="toggleSidebar()" class="lg:hidden p-1.5 rounded-lg transition-colors" style="color:#64748B;" onmouseover="this.style.background='#F1F5F9'" onmouseout="this.style.background='transparent'">
            <i data-lucide="menu" class="w-5 h-5"></i>
          </button>
          <div>
            <h1 id="page-title" class="font-bold" style="font-family:'Manrope',sans-serif; font-size:15px; color:#0F172A;">Dashboard</h1>
            <p id="page-subtitle" class="text-xs mt-0.5" style="color:#94A3B8;">Operations Overview</p>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <!-- Global Search -->
          <div id="gk-search-wrapper" class="hidden sm:flex relative items-center gap-2 rounded-lg px-3 py-2 w-56 lg:w-72" style="background:#F8FAFC; border:1px solid #E2E8F0;">
            <i data-lucide="search" class="w-3.5 h-3.5 flex-shrink-0" style="color:#94A3B8;"></i>
            <input id="gk-search-input" type="text" placeholder="Search trips, PNR, customers…"
              style="background:transparent; font-size:13px; color:#334155; outline:none; width:100%;"
              oninput="GKSearch.show(this.value)"
              onblur="setTimeout(()=>GKSearch.close(),200)"
              onkeydown="if(event.key==='Escape'){this.value='';GKSearch.close();}" />
          </div>

          <!-- Notifications -->
          <button id="notif-btn" class="relative p-2 rounded-lg transition-all" style="color:#64748B;" onclick="toggleNotifications()" onmouseover="this.style.background='#F1F5F9'" onmouseout="this.style.background='transparent'">
            <i data-lucide="bell" class="w-4.5 h-4.5"></i>
            <span id="notif-badge" class="notif-badge hidden">0</span>
          </button>

          <!-- Quick Add -->
          <div class="relative flex items-center">
            <button onclick="showQuickAdd()" class="flex items-center gap-2 text-xs font-semibold px-3.5 py-2 rounded-l-lg transition-all" style="background:#2563EB; color:#fff; box-shadow:0 1px 4px rgba(37,99,235,0.3);" onmouseover="this.style.background='#1D4ED8'" onmouseout="this.style.background='#2563EB'">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i>
              <span class="hidden sm:inline">New Trip</span>
            </button>
            <button onclick="toggleQuickMenu()" class="text-xs font-semibold px-2 py-2 rounded-r-lg transition-all" style="background:#1D4ED8; color:#fff; border-left:1px solid rgba(255,255,255,0.2);" onmouseover="this.style.background='#1E40AF'" onmouseout="this.style.background='#1D4ED8'">
              <i data-lucide="chevron-down" class="w-3 h-3"></i>
            </button>
            <div id="quick-menu" class="hidden absolute top-full right-0 mt-2 w-52 rounded-xl overflow-hidden z-50" style="background:#FFFFFF; border:1px solid #E2E8F0; box-shadow:0 8px 24px rgba(15,23,42,0.12);">
              <button onclick="showQuickAdd();toggleQuickMenu()" class="w-full text-left px-4 py-3 text-sm flex items-center gap-3 transition-colors" style="color:#334155;" onmouseover="this.style.background='#F8FAFC'" onmouseout="this.style.background='transparent'">
                <i data-lucide="folder-open" class="w-4 h-4" style="color:#2563EB;"></i> New Trip File
              </button>
              <button onclick="(window.BookingsModule||{showAddBooking:showQuickAdd}).showAddBooking?.('flight');toggleQuickMenu()" class="w-full text-left px-4 py-3 text-sm flex items-center gap-3 transition-colors" style="color:#334155;" onmouseover="this.style.background='#F8FAFC'" onmouseout="this.style.background='transparent'">
                <i data-lucide="ticket" class="w-4 h-4" style="color:#059669;"></i> New Booking
              </button>
              <button onclick="(window.CustomersModule||{showAddCustomer:()=>{}}).showAddCustomer();toggleQuickMenu()" class="w-full text-left px-4 py-3 text-sm flex items-center gap-3 transition-colors" style="color:#334155;" onmouseover="this.style.background='#F8FAFC'" onmouseout="this.style.background='transparent'">
                <i data-lucide="user-plus" class="w-4 h-4" style="color:#7C3AED;"></i> New Customer
              </button>
            </div>
          </div>
        </div>
      </header>

      <!-- MODULE CONTENT -->
      <main id="module-view" class="flex-1 overflow-y-auto bg-black">
        <div class="p-6">
          <div class="flex items-center justify-center h-64 text-gray-600">
            <div class="text-center">
              <i data-lucide="loader-2" class="w-8 h-8 mx-auto mb-3 animate-spin"></i>
              <p class="text-sm">Loading operations center…</p>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- QUICK ADD MODAL -->
  <div id="quick-add-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="absolute inset-0 backdrop-blur-sm" style="background:rgba(15,23,42,0.55);" onclick="hideQuickAdd()"></div>
    <div class="relative rounded-2xl w-full max-w-lg" style="background:#FFFFFF; border:1px solid #E2E8F0; box-shadow:0 24px 64px rgba(15,23,42,0.18);">
      <!-- Modal Header -->
      <div class="flex items-center justify-between px-6 py-4" style="border-bottom:1px solid #F1F5F9;">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background:#EFF6FF;">
            <i data-lucide="folder-plus" class="w-4 h-4" style="color:#2563EB;"></i>
          </div>
          <h2 class="font-bold" style="font-family:'Manrope',sans-serif; font-size:15px; color:#0F172A;">New Trip File</h2>
        </div>
        <button onclick="hideQuickAdd()" class="p-1.5 rounded-lg transition-colors" style="color:#94A3B8;" onmouseover="this.style.background='#F1F5F9';this.style.color='#334155'" onmouseout="this.style.background='transparent';this.style.color='#94A3B8'">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      <!-- Modal Body -->
      <div class="px-6 py-5 space-y-4">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="form-label">Customer Name *</label>
            <input id="qt-customer" type="text" placeholder="Full name" class="form-input" />
          </div>
          <div>
            <label class="form-label">Phone</label>
            <input id="qt-phone" type="text" placeholder="+91 98765 43210" class="form-input" />
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="form-label">Destination *</label>
            <input id="qt-dest" type="text" placeholder="Dubai, Maldives, Bali…" class="form-input" />
          </div>
          <div>
            <label class="form-label">No. of Pax</label>
            <input id="qt-pax" type="number" placeholder="2" min="1" class="form-input" />
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="form-label">Departure Date</label>
            <input id="qt-dep" type="date" class="form-input" />
          </div>
          <div>
            <label class="form-label">Return Date</label>
            <input id="qt-ret" type="date" class="form-input" />
          </div>
        </div>
        <div>
          <label class="form-label">Trip Type</label>
          <select id="qt-type" class="form-input">
            <option>Honeymoon Package</option>
            <option>Family Vacation</option>
            <option>Corporate Trip</option>
            <option>Group Tour</option>
            <option>Solo Travel</option>
            <option>Luxury Escape</option>
          </select>
        </div>
        <div>
          <label class="form-label">Notes</label>
          <textarea id="qt-notes" placeholder="Special requests, preferences…" rows="2" class="form-input resize-none"></textarea>
        </div>
      </div>
      <!-- Modal Footer -->
      <div class="flex items-center justify-between px-6 py-4" style="border-top:1px solid #F1F5F9; background:#FAFBFC; border-radius:0 0 16px 16px;">
        <button onclick="hideQuickAdd()" class="btn-ghost text-sm">Cancel</button>
        <button onclick="createTrip()" class="btn-primary text-sm">
          <i data-lucide="folder-plus" class="w-3.5 h-3.5"></i> Create Trip File
        </button>
      </div>
    </div>
  </div>

  <!-- Global Modal Root -->
  <div id="gk-modal-root"></div>

  <!-- NOTIFICATION PANEL -->
  <div id="notification-panel" class="hidden fixed right-4 top-14 z-[100] w-80 rounded-2xl overflow-hidden" style="background:#FFFFFF; border:1px solid #E2E8F0; box-shadow:0 16px 48px rgba(15,23,42,0.14),0 4px 16px rgba(15,23,42,0.08);">
    <div class="px-4 py-3.5 flex items-center justify-between" style="border-bottom:1px solid #F1F5F9; background:#FAFBFC;">
      <div class="flex items-center gap-2">
        <i data-lucide="bell" class="w-3.5 h-3.5" style="color:#2563EB;"></i>
        <span class="text-sm font-semibold" style="color:#0F172A;">Alerts & Reminders</span>
      </div>
      <span class="text-xs font-medium" id="notif-count" style="color:#94A3B8;">No new alerts</span>
    </div>
    <div class="max-h-80 overflow-y-auto" id="notif-list">
      <div class="px-4 py-8 text-center">
        <i data-lucide="bell-off" class="w-6 h-6 mx-auto mb-2" style="color:#CBD5E1;"></i>
        <p class="text-xs" style="color:#94A3B8;">No notifications yet</p>
      </div>
    </div>
    <div class="px-4 py-3" style="border-top:1px solid #F1F5F9; background:#FAFBFC;">
      <button onclick="GKApp.navigate('reminders');toggleNotifications()" class="text-xs font-semibold w-full text-center transition-colors" style="color:#2563EB;" onmouseover="this.style.color='#1D4ED8'" onmouseout="this.style.color='#2563EB'">View all reminders →</button>
    </div>
  </div>

  <!-- Scripts (module order matters) -->
  <script src="assets/js/data.js"></script>
  <script src="assets/js/workflow.js"></script>
  <script src="assets/js/modules/export.js"></script>
  <script src="assets/js/modules/dashboard.js"></script>
  <script src="assets/js/modules/leads.js"></script>
  <script src="assets/js/modules/trips.js"></script>
  <script src="assets/js/modules/bookings.js"></script>
  <script src="assets/js/modules/customers.js"></script>
  <script src="assets/js/modules/operations.js"></script>
  <script src="assets/js/modules/tasks.js"></script>
  <script src="assets/js/modules/finance.js"></script>
  <script src="assets/js/modules/documents.js"></script>
  <script src="assets/js/modules/reminders.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
